name: CI

on:
  push:
    branches: [macos, main]
    paths:
      - '.github/hooks/**'
      - 'install.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '.github/hooks/**'
      - 'install.sh'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bash syntax check
        run: |
          bash -n .github/hooks/copilot-on-toast.sh
          bash -n install.sh

      - name: ShellCheck
        run: shellcheck .github/hooks/copilot-on-toast.sh install.sh

      - name: Validate JSON files
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('.github/hooks/copilot-on-toast.json'))
          assert d.get('version'), "Missing 'version' field in hooks JSON"
          assert d.get('hooks'),   "Missing 'hooks' field in hooks JSON"
          print("hooks JSON is valid. Hooks defined:", ", ".join(d['hooks']))
          json.load(open('.github/hooks/copilot-on-toast.config.json'))
          print("config JSON is valid.")
          PY

  smoke:
    name: macOS smoke test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fire every event (must exit 0)
        run: |
          set -e
          H=.github/hooks/copilot-on-toast.sh
          echo '{}'                          | COPILOT_HOOK_EVENT=sessionStart        bash "$H"
          echo '{"reason":"user_ended"}'     | COPILOT_HOOK_EVENT=sessionEnd          bash "$H"
          echo '{"toolName":"bash"}'         | COPILOT_HOOK_EVENT=permissionRequest   bash "$H"
          echo '{"error":{"message":"x"}}'   | COPILOT_HOOK_EVENT=errorOccurred       bash "$H"
          echo '{"prompt":"hello"}'          | COPILOT_HOOK_EVENT=userPromptSubmitted bash "$H"
          echo '{"toolName":"shell"}'        | COPILOT_HOOK_EVENT=postToolUseFailure  bash "$H"
          echo '{}'                          | COPILOT_HOOK_EVENT=agentStop           bash "$H"
          echo "All events exited 0."

      - name: Verify plutil JSON parsing (nested key)
        run: |
          out="$(echo '{"error":{"message":"deep"}}' | plutil -extract error.message raw -o - -)"
          [ "$out" = "deep" ] || { echo "plutil nested parse failed: '$out'"; exit 1; }
          echo "plutil parsing OK"
